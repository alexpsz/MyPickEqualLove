name: Daily discography sync

on:
  schedule:
    - cron: "17 5 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
  repository_dispatch:
    types: [daily-discography-sync]

permissions:
  contents: write

concurrency:
  group: daily-discography-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the production branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-discography.txt

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Enforce public repository boundaries
        run: npm run check:repo-boundary

      - name: Install dependencies
        run: |
          python -m pip install --requirement requirements-discography.txt
          npm ci

      - name: Test the discography merge rules
        run: npm run test:discography

      - name: Synchronize all three groups
        run: npm run sync:songs:all

      - name: Reject destructive or unexpected generated changes
        run: npm run check:data:sync:strict

      - name: Validate generated data
        run: npm run validate:data

      - name: Lint source and automation helpers
        run: npm run lint

      - name: Detect generated changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- src/projects public/covers)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build MyPickEqualLove
        if: steps.changes.outputs.changed == 'true'
        run: npm run build:equal-love

      - name: Build MyPickNearlyEqualJoy
        if: steps.changes.outputs.changed == 'true'
        run: npm run build:nearly-equal-joy

      - name: Build MyPickNotEqualMe
        if: steps.changes.outputs.changed == 'true'
        run: npm run build:not-equal-me

      - name: Type-check the built application
        if: steps.changes.outputs.changed == 'true'
        run: npx tsc --noEmit --incremental false

      - name: Restore the Next.js generated declaration
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git restore --source=HEAD --worktree -- next-env.d.ts
          git diff --exit-code HEAD -- next-env.d.ts

      - name: Recheck generated data after all builds
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run check:data:sync:strict
          npm run validate:data

      - name: Commit the verified catalog update
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src/projects/equal-love/songs.json \
            src/projects/nearly-equal-joy/songs.json \
            src/projects/not-equal-me/songs.json \
            public/covers/equal-love \
            public/covers/nearly-equal-joy \
            public/covers/not-equal-me
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "chore(data): daily discography sync"
          git push origin HEAD:main
